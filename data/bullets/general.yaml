      text: >
        Architected a Role-Based Access Control framework (NestJS, PostgreSQL) to support extensible user roles; balanced database
        \textbf{normalization} against \textbf{query performance} via denormalization and data \textbf{integrity} checks.
      tags: [backend, authorization, database]
      evidence: Production RBAC design across platform workflows.
    - id: ziyutec_caching
      text: >
        Engineered a \textbf{caching} layer to decouple client-side state from \textbf{atomic} database transactions, reducing
        \textbf{user friction} while ensuring transactional integrity.
      tags: [backend, transactions, performance]
      evidence: Reduced UX friction while preserving correctness.
    - id: ziyutec_workflow_agent
      text: >
        Built an automation agent for engineering workflow, reducing operational workload by \textbf{20\%} across a \textbf{50-person}
        engineering team.
