    - id: ziyutec_rag
      text: >
        Built a \textbf{RAG agent}, indexing \textbf{500+ enterprise documents} of different format; improved \textbf{contextual relevance
        by 16\%} (DeepEval) via \textbf{hybrid search and reranking} on synthetically generated evaluation set.
      tags: [rag, search, evaluation]
      evidence: DeepEval measured relevance improvement.
    - id: ziyutec_legacy
      text: >
        Maintained and enhanced a \textbf{multi-tenant} ERP platform comprising \textbf{60K+ lines of legacy code}, supporting
        \textbf{1,000+ active projects}. Resolved a \textbf{long-standing} session management defect by implementing
        \textbf{JWT refresh token rotation}, eliminating form data loss.
      tags: [legacy, reliability, auth]
      evidence: Fixed a persistent production session issue.
  uw_research_ner:
